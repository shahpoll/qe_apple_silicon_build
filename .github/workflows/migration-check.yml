name: QE curl build and numerical checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qe-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      QE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Harness regression assertions
        run: python3 -B -m unittest discover -s tests -v
      - name: Clean inactive build with existing tools
        run: |
          python3 scripts/install_qe.py --backend openblas \
            --blas-library "$QE_BLAS_LIBRARY" --jobs 2 --profile core \
            --install-prefix "$RUNNER_TEMP/qe-${{ env.QE_RUN_TOKEN }}" \
            --out-dir "$RUNNER_TEMP/qe-build-${{ env.QE_RUN_TOKEN }}"
      - name: Numerical qualification
        run: |
          SUITE=$(python3 -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/qe-build-${{ env.QE_RUN_TOKEN }}/candidate.json"; print(json.load(open(p))["path"]+"/bin")')
          python3 scripts/validate_build.py --qe-bin "$SUITE" \
            --out-dir "$RUNNER_TEMP/qe-check-${{ env.QE_RUN_TOKEN }}"
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-evidence-${{ env.QE_RUN_TOKEN }}
          path: |
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/cases/
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/*.json
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/*.jsonl
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/*.md
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/source/
            ${{ runner.temp }}/qe-build-${{ env.QE_RUN_TOKEN }}/work/suite-manifest.json
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/cases/
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/*.json
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/*.jsonl
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/*.md
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/inputs/
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/data/
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/source/
            ${{ runner.temp }}/qe-check-${{ env.QE_RUN_TOKEN }}/work/suite-manifest.json
